name: Revisión automática de prendas
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['moderation/review.py', '.github/workflows/revision-ropa.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: sadoc-clothing-review
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Consultar anuncios pendientes
        id: cola
        run: python3 moderation/review.py queue
      - uses: actions/setup-python@v5
        if: steps.cola.outputs.pending != '0' || github.event_name != 'schedule'
        with:
          python-version: '3.11'
      - name: Instalar clasificador
        if: steps.cola.outputs.pending != '0' || github.event_name != 'schedule'
        run: |
          python3 -m venv /tmp/sadoc-vision
          /tmp/sadoc-vision/bin/pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchvision==0.22.1
          /tmp/sadoc-vision/bin/pip install --quiet transformers==4.53.3 Pillow==11.3.0
      - name: Verificar y clasificar fotos
        if: steps.cola.outputs.pending != '0' || github.event_name != 'schedule'
        run: /tmp/sadoc-vision/bin/python moderation/review.py process
