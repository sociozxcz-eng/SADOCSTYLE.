name: Comprobar vistas públicas de publicación
on:
  push:
    branches: [prueba-vistas-publicacion]
permissions: {}
jobs:
  vistas:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm install playwright@1.55.0 --no-save --silent
          node <<'JS'
          const {chromium, devices} = require('playwright');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for(const [name,options] of [['computador',{viewport:{width:1366,height:800}}],['celular',{...devices['Pixel 7'],deviceScaleFactor:1}]]){
              const page=await browser.newPage(options);
              for(let i=0;i<24;i++){
                await page.goto('https://sociozxcz-eng.github.io/SADOCSTYLE./?rev=4e5eb80&t='+i+'#vender');
                if(await page.locator('footer a[href="https://www.tiktok.com/@sadocstyle.rx"]').count())break;
                await new Promise(r=>setTimeout(r,5000));
              }
              await page.getByText(/Publicar y vender ropa en SADOCSTYLE es gratis/).waitFor();
              await page.locator('#vender').getByRole('button',{name:'Publicar una prenda'}).click();
              await page.getByText('$0 de comisión',{exact:true}).waitFor();
              await page.goto('https://sociozxcz-eng.github.io/SADOCSTYLE./?rev=4e5eb80#soporte');
              await page.locator('#shop-question').fill('¿Cuánto es la comisión?');
              await page.locator('#shop-assistant button[type=submit]').click();
              await page.locator('#shop-log').getByText(/La comisión es de \$0/).waitFor();
              console.log('CAPTURA_'+name+'='+(await page.locator('footer').screenshot({type:'jpeg',quality:65})).toString('base64'));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
