name: Comprobar vistas públicas de publicación
on:
  push:
    branches: [prueba-vistas-publicacion]
permissions: {}
jobs:
  vistas:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm install playwright@1.55.0 --no-save --silent
          node <<'JS'
          const {chromium, devices} = require('playwright');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for(const [name,options] of [['computador',{viewport:{width:1366,height:800}}],['celular',{...devices['Pixel 7'],deviceScaleFactor:1}]]){
              const page=await browser.newPage(options);
              await page.route('**/shop-client.js',route=>route.fulfill({contentType:'application/javascript',body:`export const client={auth:{onAuthStateChange:fn=>fn('INITIAL_SESSION',{user:{id:'demo'}})},rpc:async(name,args)=>({data:name==='sadoc_chat_agent'?true:name==='sadoc_chat_inbox'?[{chat:'uno',updated_at:new Date().toISOString()},{chat:'dos',updated_at:new Date(Date.now()-86400000).toISOString()}]:{transcript:'Cliente: '+(args.chat==='uno'?'Pregunta por una chaqueta':'Consulta sobre una talla'),messages:[]}})}`}));
              for(let i=0;i<24;i++){
                await page.goto('https://sociozxcz-eng.github.io/SADOCSTYLE./?rev=4cc6fd3&t='+i+'#soporte');
                if(await page.locator('nav#staff-chats').count())break;
                await new Promise(r=>setTimeout(r,5000));
              }
              await page.getByRole('button',{name:'Reportar una publicación'}).click();
              await page.getByText('Dime el nombre de la publicación y qué ocurrió.').waitFor();
              await page.locator('#staff-chats button').nth(1).click();
              await page.locator('#staff-history').getByText('Cliente: Consulta sobre una talla').waitFor();
              const panel=page.locator('#staff-panel');
              console.log('CAPTURA_'+name+'='+(await panel.screenshot({type:'jpeg',quality:66})).toString('base64'));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
