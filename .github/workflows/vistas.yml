name: Comprobar vistas públicas de publicación
on:
  push:
    branches: [prueba-vistas-publicacion]
permissions: {}
jobs:
  vistas:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm install playwright@1.55.0 --no-save --silent
          node <<'JS'
          const {chromium, devices} = require('playwright');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for(const [name,options] of [['computador',{viewport:{width:1366,height:800}}],['celular',{...devices['Pixel 7'],deviceScaleFactor:1}]]){
              const page=await browser.newPage(options);
              await page.goto('https://sociozxcz-eng.github.io/SADOCSTYLE./?rev=f6a8e1c#registro');
              await page.getByText('Próximamente · Pago contraentrega',{exact:true}).waitFor();
              const address=page.locator('#seller-signup input[name="pickup_address"]');
              await address.scrollIntoViewIfNeeded();
              if(!await address.isVisible() || !await address.evaluate(el=>el.required)) throw Error('Dirección obligatoria');
              if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth)) throw Error('Desbordamiento');
              const jpg=await page.screenshot({type:'jpeg',quality:65});
              console.log('CAPTURA_'+name+'='+jpg.toString('base64'));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
