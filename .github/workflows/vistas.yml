name: Comprobar vistas públicas de publicación
on:
  push:
    branches: [prueba-vistas-publicacion]
permissions: {}
jobs:
  vistas:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm install playwright@1.55.0 --no-save --silent
          node <<'JS'
          const {chromium, devices} = require('playwright');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for(const [name,options] of [['computador',{viewport:{width:1366,height:800}}],['celular',{...devices['Pixel 7'],deviceScaleFactor:1}]]){
              const page=await browser.newPage(options);
              for(let i=0;i<24;i++){
                await page.goto('https://sociozxcz-eng.github.io/SADOCSTYLE./?rev=5ad653a&t='+i+'#comisiones');
                if(await page.locator('#calctype option[value="0.02"]').count())break;
                await new Promise(r=>setTimeout(r,5000));
              }
              await page.locator('#calcprice').fill('50000');
              for(const [rate,fee,net] of [['0.05','2.500','47.500'],['0.02','1.000','49.000']]){
                await page.locator('#calctype').selectOption(rate);
                const result=await page.locator('#calcresult').innerText();
                if(!result.includes(fee)||!result.includes(net)) throw Error(result);
              }
              console.log('CAPTURA_'+name+'='+(await page.locator('#comisiones').screenshot({type:'jpeg',quality:60})).toString('base64'));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
